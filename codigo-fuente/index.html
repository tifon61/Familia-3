<!doctype html>
<!-- translate="no": el traductor automático del navegador modifica el texto
     de la página por su cuenta y eso rompe React (pantalla en blanco). -->
<html lang="es" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#003f6b" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Montserrat:wght@800;900&display=swap" rel="stylesheet" />
    <title>Taller de Información Meteorológica</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⛈️</text></svg>" />
    <!--
      CONFIGURACIÓN: se puede editar a mano directamente en el index.html
      publicado, sin volver a compilar.
    -->
    <script>
      window.CONFIG_TALLER = {
        // URL de la aplicación web de Apps Script para guardar cada reporte
        // como una fila en Google Sheets (ver GOOGLE-SHEETS.md).
        // Ej.: 'https://script.google.com/macros/s/XXXX/exec'. Vacío = no se usa.
        googleSheet: 'https://script.google.com/macros/s/AKfycbzVEPt2i-d0dY8zrRxfwvTeT2ryCNVChdT0yc1eKjrU9qnAMS7nlW5yZnb0iPP803NYsA/exec',
        // Dirección de Formspree para recibir los reportes por mail.
        // Ej.: 'https://formspree.io/f/abcdwxyz'. Vacío = no se envía nada.
        formspree: '',
        // Nombre que aparece en el encabezado, debajo del título.
        institucion: 'Grupo de Pronóstico de la UNLP',
        // Carpeta donde están el logo y las imágenes de las situaciones.
        carpetaImagenes: './imagenes/',
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
