<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Familia Alrededor del Mundo</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <header class="app-header">
    <h1>🌍 Familia Alrededor del Mundo</h1>
    <p>Qué hora es y dónde está cada uno, ahora mismo</p>
  </header>

  <main>
    <section id="tarjetas" class="tarjetas">
      <!-- Se completa por JS -->
    </section>

    <div id="mapa"></div>

    <section class="checkin">
      <h2>Contá dónde estás</h2>
      <div id="aviso-backend" class="aviso" style="display:none"></div>
      <form id="form-checkin" class="subir-form">
        <label>Quién sos</label>
        <select name="familiarId" required></select>

        <label>Ciudad y país</label>
        <button type="button" id="btn-geo">📍 Usar mi ubicación actual</button>
        <input type="text" name="ciudad" placeholder="Ciudad" required>
        <input type="text" name="pais" placeholder="País" required>
        <input type="hidden" name="lat">
        <input type="hidden" name="lon">
        <input type="hidden" name="zonaHoraria">

        <label>¿Qué estás haciendo?</label>
        <textarea name="descripcion" placeholder="Contá algo..." rows="2"></textarea>

        <label>Foto o video (opcional)</label>
        <input type="file" name="archivo" accept="image/*,video/*">

        <button type="submit">Publicar</button>
      </form>
    </section>

    <section>
      <h2>Muro familiar</h2>
      <div id="feed" class="historico"></div>
    </section>
  </main>

  <script src="assets/js/config.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/luxon@3/build/global/luxon.min.js"></script>
  <script src="assets/js/reloj.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
