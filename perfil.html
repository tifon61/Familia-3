<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil · Familia</title>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <main>
    <p><a class="volver" href="index.html">← Volver al mapa</a></p>

    <section id="perfil-header" class="perfil-header">
      <p class="muted">Cargando...</p>
    </section>

    <div id="aviso-backend" class="aviso" style="display:none"></div>

    <form id="form-subir" class="subir-form">
      <h3>Agregar al histórico</h3>
      <input type="text" name="titulo" placeholder="Título (ej: Almuerzo familiar)">
      <textarea name="descripcion" placeholder="Descripción" rows="2"></textarea>
      <input type="file" name="archivo" accept="image/*,video/*">
      <button type="submit">Publicar</button>
    </form>

    <section id="historico" class="historico"></section>
  </main>

  <script src="assets/js/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/luxon@3/build/global/luxon.min.js"></script>
  <script src="assets/js/reloj.js"></script>
  <script src="assets/js/perfil.js"></script>
</body>
</html>
