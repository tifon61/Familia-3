<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil · Familia</title>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <main>
    <p><a class="volver" href="index.html">← Volver al mapa</a></p>

    <section id="perfil-header" class="perfil-header">
      <p class="muted">Cargando...</p>
    </section>

    <div id="aviso-backend" class="aviso" style="display:none"></div>

    <button type="button" id="btn-toggle-editar" class="volver" style="background:none;border:none;cursor:pointer;padding:0;font:inherit">✏️ Editar este perfil</button>

    <form id="form-perfil" class="subir-form" style="display:none">
      <label>Nombre</label>
      <input type="text" name="nombre" placeholder="Nombre">

      <label>Foto de perfil (opcional)</label>
      <input type="file" name="avatarArchivo" accept="image/*">

      <label>Sobre mí</label>
      <textarea name="bio" placeholder="Contá algo sobre vos" rows="2"></textarea>

      <button type="submit">Guardar</button>
    </form>

    <h2>Histórico</h2>
    <section id="historico" class="historico"></section>
  </main>

  <script src="assets/js/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/luxon@3/build/global/luxon.min.js"></script>
  <script src="assets/js/reloj.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/perfil.js"></script>
</body>
</html>
